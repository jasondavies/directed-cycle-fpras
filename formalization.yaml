alignment:
  namespace: "DirectedCycleFPRAS.Publication"
  statements:
    - source: "Paper: vertex-splitting reliability reduction"
      lean: "DirectedCycleFPRAS.Publication.vertex_reliability"
      module: "Solution"
      status: proved
      note: "A nonempty return walk is equivalent to reachability between split terminals."
    - source: "Paper: feedback-set witness cover"
      lean: "DirectedCycleFPRAS.Publication.feedback_cover"
      module: "Solution"
      status: proved
      note: "Deleting the supplied vertices destroys every support cycle."
    - source: "Paper: counting theorem, probability guarantee"
      lean: "DirectedCycleFPRAS.Publication.count_correct"
      module: "Solution"
      status: proved
      note: "Actual rational implementation on a uniform finite tape; runtime is written."
    - source: "Paper: exact zero detection"
      lean: "DirectedCycleFPRAS.Publication.count_zero"
      module: "Solution"
      status: proved
      note: "Every tape returns zero when cyclicity probability is zero."
    - source: "Paper: conditional-sampling theorem, total variation guarantee"
      lean: "DirectedCycleFPRAS.Publication.sample_correct"
      module: "Solution"
      status: proved
      note: "Positive cyclicity probability; dyadic error and explicit finite tape budget."
    - source: "Paper: conditional law undefined when cyclicity probability is zero"
      lean: "DirectedCycleFPRAS.Publication.sample_none_iff"
      module: "Solution"
      status: proved
      note: "For valid probabilities and feedback cover, none occurs exactly at zero mass on every tape."
    - source: "Paper: complement-hardness gadget"
      lean: "DirectedCycleFPRAS.Publication.acyclicity_probability"
      module: "Solution"
      status: proved
      note: "Exact probability identity; the complexity hardness consequence is external."

