fidelity:
  divergences: >-
    The paper presents general epsilon and delta parameters; the executable
    interface uses reciprocal accuracy 1/r for a positive natural r and dyadic
    failure or variation target 2^(-d). Graphs in that interface have vertices
    Fin n and edges Fin m; the library accepts arbitrary finite types with supplied
    enumerations. Conditional variation is expressed using all [0,1]-valued test
    functions on the finite configuration space. The witness cover and gadget are
    also stated for arbitrary types where appropriate. Finite choices are rounded
    with bounded fair-bit draws rather than ideal uniform real draws. Polynomial
    time in the bit model is a written theorem, not a formal machine-step bound.
    The displayed optimized cost uses stored cumulative weights and indexed
    pools; the supplied executable uses repeated cumulative scans and lists and
    has a separate, much looser polynomial cost bound.
    The library correspondence proofs cover Algorithm S, not all algorithms in
    Feng–Fu–Guo.

