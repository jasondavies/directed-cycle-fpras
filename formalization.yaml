status:
  scope: >-
    The compared results are vertex splitting, the feedback-set cover, executable
    counting accuracy and exact zero, executable conditional-sampling accuracy,
    the checked sampler's exact undefined-case interface, and the
    independent-set/acyclicity probability identity. The two definition
    holes in Challenge.lean are filled by executable algorithms in Solution.lean;
    their graph notions, product probabilities and finite fair-bit budgets are
    explicit in the Challenge. The proof library includes Algorithm S accuracy
    without an oracle-accuracy assumption, adaptive coupling, amplification,
    resource bounds, and rational arithmetic heights. Polynomial machine runtime,
    independent-set inapproximability, and Python-to-Lean refinement are outside
    the formal guarantees. Probability and tape-length bounds alone do not
    exclude exponential computation; Comparator checks the supplied definitions
    and their laws, not an FPRAS runtime bound.
    The stated conditional law requires positive cyclicity
    probability; the compared sampling theorem does not separately assert
    validity of every output on failed-oracle histories.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

