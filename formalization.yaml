version: "v0.4"

project:
  name: "Directed-cycle probability: verified counting and conditional sampling"
  description: >-
    For finite directed multigraphs with independent rational edge retention,
    executable counting and conditional-sampling algorithms have proved accuracy
    guarantees on uniformly random finite bit tapes. Counting has relative error
    1/r with failure at most 2^(-d) and returns exactly zero whenever cyclicity has
    probability zero. Conditional sampling has total variation error at most
    2^(-d); its checked frontend reports an undefined conditional law exactly
    when cyclicity probability is zero. Valid retention probabilities and a
    valid supplied feedback vertex set are preconditions; the frontends do not
    validate the set. Vertex splitting reduces cycle membership to two-terminal
    reliability, implemented using a formalized Algorithm S and its accuracy
    theorem. The independent-set
    gadget gives an exact identity for acyclicity probability. Explicit fair-bit
    budgets and arithmetic-size bounds are verified; polynomial machine runtime
    is treated by separate written bounds for an indexed implementation and the
    supplied executable's generic weighted choices and lists.
  authors: ["Jason Davies"]
  license: "Apache-2.0"
  responsible_maintainers: ["Jason Davies"]

